
[package]
name = "criptivo_mls"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "rust_lib_criptivo"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
openmls = "0.9.0"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"

base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flutter_rust_bridge = "=2.13.0"