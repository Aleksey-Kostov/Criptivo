name: criptivo
description: "Encrypted messaging with Glagolitic Seal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.4

  # Crypto
  cryptography: ^2.7.0
  convert: ^3.1.2
  flutter_secure_storage: ^9.2.4

  # Utils
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.19.0
  characters: ^1.3.0
  http: ^1.2.2
  url_launcher: ^6.3.1

  # Media / attachments
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  emoji_picker_flutter: ^4.3.0
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2

  # Voice
  record: ^5.2.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

  # Open / share
  open_filex: ^4.5.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/criptivo_logo.png"
  adaptive_icon_background: "#0A0E17"
  adaptive_icon_foreground: "assets/images/criptivo_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/criptivo_logo.png
    - assets/images/chat_background.png
    - assets/images/chat_background_dark.png
    - assets/images/chat_background_light.png

  fonts:
    - family: NotoSansGlagolitic
      fonts:
        - asset: assets/fonts/NotoSansGlagolitic-Regular.ttf