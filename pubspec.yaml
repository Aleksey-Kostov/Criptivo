name: criptivo
description: "Encrypted messaging with Glagolitic Seal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  cryptography: ^2.7.0
  convert: ^3.1.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.19.0
  characters: ^1.3.0

  # Avatar / media
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  http: ^1.2.2
  emoji_picker_flutter: ^4.3.0

  # Voice messages
  record: ^5.2.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/criptivo_logo.png
    - assets/images/chat_background.png

  fonts:
    - family: NotoSansGlagolitic
      fonts:
        - asset: assets/fonts/NotoSansGlagolitic-Regular.ttf
